## This is the main LVGL section. We start with a simple grid.
lvgl:
  buffer_size: 100%
  pages:
    - id: main_page
      layout: 4x9
      styles: page_style
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml

    - id: second_page
      layout: 4x9
      styles: page_style
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml      
      widgets:
        # You can use the package section above to add prebuilt button types or build your own custom button from scratch here.
        - container:
            id: button_13
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            grid_cell_row_pos: 3
            grid_cell_column_pos: 8
            grid_cell_row_span: 1
            grid_cell_column_span: 1
            widgets:
              - label:
                  text_font: $text_font
                  align: center
                  text_color: white
                  text: ""


# If you want to use other icons add them to the list here

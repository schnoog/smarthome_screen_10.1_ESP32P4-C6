# Remote image button tile — triggers a Home Assistant entity on press.
#
# vars:
#   uid:          unique identifier
#   entity_id:    HA entity, e.g. "button.restart", "script.good_night",
#                 "scene.movie_mode", "input_button.some_button"
#   row:          grid row
#   column:       grid column
#   text:         tile label
#   icon:         icon glyph
#   background:   LVGL image id
#   row_span:     (default: 1)
#   column_span:  (default: 1)
#   page_id:      parent page (default: main_page)

lvgl:
  pages:
  - id: !extend ${page_id | default("main_page")}
    widgets:
    - container:
        id: ${uid}_tile
        grid_cell_row_pos: ${row}
        grid_cell_column_pos: ${column}
        grid_cell_row_span: ${row_span | default(1)}
        grid_cell_column_span: ${column_span | default(1)}
        grid_cell_x_align: stretch
        grid_cell_y_align: stretch

        widgets:
        - button:
            id: button_${uid}

            # Background image
            bg_image_src: ${background}
            bg_image_opa: 100%
            bg_opa: 0%

            widgets:

            # Overlay icon
            - label:
                id: icon_${uid}
                text_font: $icon_font
                align: top_left
                text: ${icon | default("")}

            # Overlay text
            - label:
                id: label_${uid}
                align: bottom_left
                long_mode: wrap
                width: 100%
                text: ${text | default("")}

            on_short_click:
              then:
              - homeassistant.action:
                  action: homeassistant.turn_on
                  data:
                    entity_id: ${entity_id}
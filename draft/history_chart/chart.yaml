lvgl:
  pages:
    - id: !extend ${page_id | default("main_page")}
      widgets:
        - obj:
            id: ${uid}_history_root
            grid_cell_row_pos: ${row | default(0)}
            grid_cell_column_pos: ${column | default(0)}
            grid_cell_row_span: ${row_span | default(4)}
            grid_cell_column_span: ${column_span | default(4)}
            bg_color: $button_off_color
            bg_opa: cover
            radius: 12
            pad_all: 8
            layout:
              type: flex
              flex_flow: column
              flex_align_main: space_evenly
              flex_align_cross: stretch
            widgets:
              - label:
                  id: ${uid}_history_title
                  text: "${title | default('Historie')}"
                  text_color: $label_on_color
                  width: 100%
                  height: 10%

              - obj:
                  id: ${uid}_history_plot_area
                  width: 100%
                  height: 64%
                  bg_color: "very_dark_gray"
                  bg_opa: cover
                  radius: 8
                  pad_all: 4
                  widgets:
                    - line:
                        id: ${uid}_history_plot_1
                        width: 100%
                        height: 100%
                        line_width: 3
                        line_rounded: true
                        line_color: "ep_orange"
                        points:
                          - x: !lambda 'return int((float(0) / 47) * lv_obj_get_width(id(${uid}_history_plot_1)));'
                            y: !lambda 'return id(${uid}_history_data)->y(0, 0, lv_obj_get_height(id(${uid}_history_plot_1)));'
                          - x: !lambda 'return int((float(1) / 47) * lv_obj_get_width(id(${uid}_history_plot_1)));'
                            y: !lambda 'return id(${uid}_history_data)->y(0, 1, lv_obj_get_height(id(${uid}_history_plot_1)));'

# ui/history_chart/chart.yaml
#
# Historical Home Assistant recorder chart for esphome-modular-lvgl-buttons.
# User configuration is supplied through !include vars only.
#
# Required:
#   uid
#   temperature_entity
#
# Optional:
#   humidity_entity
#   pressure_entity
#   title
#   row, column, row_span, column_span, page_id
#
# The three recorder queries deliberately contain up to three IDs. If humidity
# or pressure is omitted, the corresponding query uses temperature_entity
# again; the C++ data store de-duplicates equal IDs.

esphome:
  includes:
    - esphome-modular-lvgl-buttons/ui/history_chart/history_chart.h
    - esphome-modular-lvgl-buttons/ui/history_chart/history_chart.cpp

globals:
  - id: ${uid}_history_data
    type: esphome::modular_history_chart::HistoryChartData *
    restore_value: no
    initial_value: 'new esphome::modular_history_chart::HistoryChartData()'

script:
  - id: ${uid}_history_query_1h
    then:
      - lambda: |-
          id(${uid}_history_data)->begin("1h", "${temperature_entity}", "${humidity_entity | default(temperature_entity)}", "${pressure_entity | default(temperature_entity)}");
      - lvgl.label.update:
          id: ${uid}_history_status
          text: "Lade 1h …"
      - homeassistant.action:
          action: recorder.get_statistics
          data:
            statistic_ids:
              - "${temperature_entity}"
              - "${humidity_entity | default(temperature_entity)}"
              - "${pressure_entity | default(temperature_entity)}"
            start_time: "{{ (now() - timedelta(hours=1)).isoformat() }}"
            end_time: "{{ now().isoformat() }}"
            period: 5minute
#            types:
#              - mean
          capture_response: true
          on_success:
            - lambda: |-
                id(${uid}_history_data)->load_response(response);
            - lvgl.widget.refresh: ${uid}_history_plot_1
            - lvgl.widget.refresh: ${uid}_history_plot_2
            - lvgl.widget.refresh: ${uid}_history_plot_3
            - lvgl.widget.refresh: ${uid}_history_minmax_1
            - lvgl.widget.refresh: ${uid}_history_minmax_2
            - lvgl.widget.refresh: ${uid}_history_minmax_3
            - lvgl.label.update:
                id: ${uid}_history_status
                text: "1h"
          on_error:
            - lvgl.label.update:
                id: ${uid}_history_status
                text: "HA-Fehler"

  - id: ${uid}_history_query_6h
    then:
      - lambda: |-
          id(${uid}_history_data)->begin("6h", "${temperature_entity}", "${humidity_entity | default(temperature_entity)}", "${pressure_entity | default(temperature_entity)}");
